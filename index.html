<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brøytelogg</title>
<meta name="theme-color" content="#0c111c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0c111c; --surface:#151c2b; --surface2:#1c2436; --line:#27314a;
  --fg:#eef2fa; --muted:#8e9ab5;
  --accent:#f6a41d; --accent-fg:#1a1200;
  --ok:#4fc27a; --danger:#e0566a;
  --font-display:"Barlow Condensed",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f4f8; --surface:#ffffff; --surface2:#e9edf4; --line:#d7dde8;
    --fg:#17202e; --muted:#5d6981;
    --accent:#d98a00; --accent-fg:#ffffff;
    --ok:#1f8a4d; --danger:#c22f45;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:15px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);
}
.app{max-width:540px; margin:0 auto; padding-bottom:110px; min-height:60vh}
header.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:14px 0 8px}
.brand{font-family:var(--font-display); font-weight:700; font-size:28px; letter-spacing:.5px; text-transform:uppercase}
.brand .flake{color:var(--accent)}
.sub{color:var(--muted); font-size:13px}
h2{font-family:var(--font-display); font-size:22px; text-transform:uppercase; letter-spacing:.6px; margin:16px 0 10px; text-wrap:balance}
.cardlist{display:flex; flex-direction:column; gap:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px}
.kunde-head{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.kunde-navn{font-weight:600; font-size:16px; min-width:0; overflow-wrap:anywhere}
.kunde-adr{color:var(--muted); font-size:13px; overflow-wrap:anywhere}
.badge{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; white-space:nowrap}
.avstand{font-size:12px; color:var(--ok); font-variant-numeric:tabular-nums; white-space:nowrap}
.sist{font-size:13px; color:var(--muted); margin-top:4px}
.sist .fersk{color:var(--ok)}
.hindring{margin-top:6px; font-size:13px; color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent); border-radius:8px; padding:5px 9px}
.naervarsel{background:color-mix(in srgb,var(--ok) 10%,var(--surface)); border:1px solid var(--ok); border-radius:12px; padding:12px; margin-top:10px}
.naervarsel .tittel{font-family:var(--font-display); font-size:19px; text-transform:uppercase; letter-spacing:.5px}
.btnrow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
button{font:inherit; border:0; border-radius:10px; cursor:pointer; color:var(--fg)}
.btn-logg{flex:1; min-width:120px; background:var(--accent); color:var(--accent-fg); font-weight:700; font-size:16px; padding:13px 10px; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.8px}
.btn-sek{flex:1; min-width:110px; background:var(--surface2); border:1px solid var(--line); padding:13px 10px; font-weight:600}
.btn-ghost{background:none; border:1px solid var(--line); padding:8px 12px; color:var(--muted); font-size:13px}
.btn-danger{background:none; border:1px solid var(--line); color:var(--danger); padding:8px 12px; font-size:13px}
.btn-logg:active,.btn-sek:active{transform:translateY(1px)}
button:disabled{opacity:.45; cursor:default}
/* Turpanel */
.turpanel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px}
.turpanel.aktiv{border-color:var(--accent)}
.turstat{display:flex; gap:18px; margin:4px 0 10px}
.turstat>div{min-width:0}
.turstat .tall{font-family:var(--font-display); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.turstat .navn{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.gps-status{font-size:12px; color:var(--muted)}
.gps-status.god{color:var(--ok)}
.puls{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:5px; animation:puls 1.6s infinite}
@keyframes puls{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.rode-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:20px 0 8px}
.rode-navn{font-family:var(--font-display); font-size:19px; text-transform:uppercase; letter-spacing:.6px}
.rode-telling{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap}
.fremdrift{height:5px; background:var(--surface2); border-radius:999px; overflow:hidden; margin-bottom:10px}
.fremdrift>div{height:100%; background:var(--ok); border-radius:999px}
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:1000;
  background:var(--surface); border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs .inner{max-width:540px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav.tabs a{
  display:block; text-align:center; padding:12px 2px 10px; text-decoration:none;
  color:var(--muted); font-family:var(--font-display); text-transform:uppercase;
  letter-spacing:.6px; font-size:14px; border-top:2px solid transparent;
}
nav.tabs a.aktiv{color:var(--accent); border-top-color:var(--accent)}
.tom{border:1px dashed var(--line); border-radius:12px; padding:28px 18px; text-align:center; color:var(--muted)}
.tom b{color:var(--fg)}
form.skjema{display:flex; flex-direction:column; gap:10px}
label{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; flex-direction:column; gap:4px}
input,select,textarea{
  font:inherit; color:var(--fg); background:var(--surface2); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; width:100%;
}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.to-kol{display:flex; gap:10px; flex-wrap:wrap}
.to-kol>label{flex:1; min-width:140px}
.adrtreff{display:flex; flex-direction:column; gap:3px; margin-top:5px}
.adrtreff button{text-align:left; background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  padding:9px 11px; font-size:13px; border-radius:8px; text-transform:none; letter-spacing:0; font-weight:400}
.adrtreff button:hover,.adrtreff button:focus-visible{border-color:var(--accent)}
.adrstatus{font-size:12px; color:var(--muted); margin-top:5px; text-transform:none; letter-spacing:0}
.adrstatus.ok{color:var(--ok)}
.bryter{flex-direction:row; align-items:center; gap:9px; margin-top:12px; text-transform:none;
  letter-spacing:0; font-size:13px; color:var(--fg); cursor:pointer}
.bryter input{width:auto; accent-color:var(--accent); flex:0 0 auto; width:20px; height:20px}
.loggdag{color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:16px 0 6px}
.loggrad{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:6px}
.loggrad .hva{min-width:0}
.loggrad .tid{font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; white-space:nowrap}
.under{color:var(--muted); font-size:12px}
.type-pill{font-size:11px; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:middle}
.type-broyting{background:color-mix(in srgb,var(--accent) 22%,transparent); color:var(--accent)}
.type-stroing{background:color-mix(in srgb,var(--ok) 22%,transparent); color:var(--ok)}
.type-tur{background:var(--surface2); color:var(--muted)}
table.stat{width:100%; border-collapse:collapse; font-size:14px}
table.stat th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 8px; border-bottom:1px solid var(--line)}
table.stat td{padding:9px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
table.stat td.num,table.stat th.num{text-align:right}
.tabellboks{overflow-x:auto}
.sumlinje td{font-weight:700; border-bottom:0}
.periodevalg{display:flex; gap:8px; align-items:center; margin:0 0 12px}
.periodevalg select{width:auto}
#kart{height:min(62vh,520px); border-radius:12px; border:1px solid var(--line)}
.leaflet-container{background:var(--surface2)}
.toast{
  position:fixed; bottom:calc(78px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
  background:var(--surface2); border:1px solid var(--line); color:var(--fg);
  border-radius:10px; padding:10px 14px; display:flex; gap:12px; align-items:center;
  box-shadow:0 6px 24px rgba(0,0,0,.35); z-index:1100; max-width:min(92vw,480px);
}
.toast button{background:none; color:var(--accent); font-weight:700; padding:4px}
.notis{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--muted); font-size:13px; margin:10px 0}
.skjult-bak{margin-top:26px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} .puls{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="brand"><span class="flake">❄</span> Brøytelogg</div>
      <div class="sub">Logg brøyting med ett trykk — GPS sporer turen</div>
    </div>
  </header>
  <main id="innhold"></main>
</div>

<nav class="tabs" aria-label="Hovedmeny">
  <div class="inner">
    <a href="#broyt" data-fane="broyt">Brøyt</a>
    <a href="#kart" data-fane="kart">Kart</a>
    <a href="#logg" data-fane="logg">Logg</a>
    <a href="#kunder" data-fane="kunder">Kunder</a>
    <a href="#oversikt" data-fane="oversikt">Faktura</a>
  </div>
</nav>

<div id="toast" class="toast" hidden>
  <span id="toasttekst"></span>
  <button id="angre" type="button">Angre</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ================= lagring (localStorage, med eksport/backup) ================= */
const LAGER="broytelogg-v1";
// Forslag i rode-feltet, også før du har opprettet noen roder selv
const STANDARD_RODER=["Setermoen"];
let state={kunder:[],jobber:[],turer:[]};
function lesLager(){
  try{
    const raw=localStorage.getItem(LAGER);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&Array.isArray(s.kunder)) state={kunder:s.kunder||[],jobber:s.jobber||[],turer:s.turer||[]};
    }
  }catch{}
  // Engangsrydding av eksempeldata fra tidlige versjoner. Flagget gjør at
  // eksempeldata brukeren selv legger inn senere IKKE slettes ved neste åpning.
  try{
    if(!localStorage.getItem("broytelogg-demorydd")){
      fjernDemodata();
      localStorage.setItem("broytelogg-demorydd","1");
    }
  }catch{}
}
// Rydder bort eksempelkundene fra tidligere versjoner, med jobbene som hørte til
function fjernDemodata(){
  const demoIder=new Set(state.kunder.filter(k=>k.demo).map(k=>k.id));
  if(!demoIder.size) return;
  state.kunder=state.kunder.filter(k=>!k.demo);
  state.jobber=state.jobber.filter(j=>!demoIder.has(j.kundeId));
  const igjen=new Set(state.jobber.map(j=>j.id));
  state.turer=state.turer.map(t=>({...t, jobbIder:(t.jobbIder||[]).filter(id=>igjen.has(id))}));
}
// Eksempeldata man kan leke med før man legger inn egne kunder
function leggInnEksempler(){
  const nå=Date.now();
  const eks=[
    {id:"demo-"+nyId(),navn:"Nordmo Gård",adresse:"Nordmoveien 4, Setermoen",rode:"Setermoen",prismodell:"gang",pris:450,hindring:"Kumlokk ved porten — løft skjæret",lat:68.8607,lng:18.3489,aktiv:true,demo:true},
    {id:"demo-"+nyId(),navn:"Sameiet Bjørkelia",adresse:"Bjørkelia 2–14",rode:"Setermoen",prismodell:"sesong",pris:18000,lat:68.8625,lng:18.3420,aktiv:true,demo:true},
    {id:"demo-"+nyId(),navn:"Hansen",adresse:"Fjellveien 12",rode:"Setermoen",prismodell:"gang",pris:500,lat:68.8642,lng:18.3551,aktiv:true,demo:true}
  ];
  state.kunder.push(...eks);
  state.jobber.push(
    {id:nyId(),kundeId:eks[0].id,kundeNavn:eks[0].navn,type:"broyting",ts:new Date(nå-9*36e5).toISOString()},
    {id:nyId(),kundeId:eks[2].id,kundeNavn:eks[2].navn,type:"broyting",ts:new Date(nå-32*36e5).toISOString()},
    {id:nyId(),kundeId:eks[2].id,kundeNavn:eks[2].navn,type:"stroing",ts:new Date(nå-31.5*36e5).toISOString()}
  );
  lagre(); tegn();
  visToast("Eksempeldata lagt inn — fjernes under Kunder",null);
}
function lagre(){ try{ localStorage.setItem(LAGER,JSON.stringify(state)); }catch(e){ visToast("Kunne ikke lagre lokalt: "+e.message,null); } }
const nyId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= formatering ================= */
const $=s=>document.querySelector(s);
const innhold=$("#innhold");
const nok=n=>new Intl.NumberFormat("nb-NO",{style:"currency",currency:"NOK",maximumFractionDigits:0}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function relTid(iso){
  if(!iso) return "aldri logget";
  const d=(Date.now()-new Date(iso).getTime())/60000;
  if(d<1) return "akkurat nå";
  if(d<60) return Math.round(d)+" min siden";
  if(d<48*60) return Math.round(d/60)+" t siden";
  return Math.round(d/1440)+" d siden";
}
const klokke=iso=>new Date(iso).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
function dagTittel(iso){
  const dt=new Date(iso), nå=new Date();
  const same=(a,b)=>a.toDateString()===b.toDateString();
  const igår=new Date(nå); igår.setDate(nå.getDate()-1);
  if(same(dt,nå)) return "I dag";
  if(same(dt,igår)) return "I går";
  return dt.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"short"});
}
function sesongStart(){
  const nå=new Date();
  const år=nå.getMonth()>=9?nå.getFullYear():nå.getFullYear()-1;
  return new Date(år,9,1).toISOString();
}
const mFmt=m=>m<950?Math.round(m)+" m":(m/1000).toFixed(1).replace(".",",")+" km";
function varighet(ms){ const min=Math.floor(ms/60000); return Math.floor(min/60)+":"+String(min%60).padStart(2,"0"); }

/* ================= GPS / tur ================= */
let tur=null, watchId=null, sistePos=null, gpsOk=false, tickTimer=null, sisteFart=null;
let avvist=new Set(), sistVarsletId=null;
function gpsStatusTekst(){
  let t=gpsOk?'<span class="puls"></span>GPS aktiv':"Venter på GPS …";
  if(sistePos) t+=` · ±${Math.round(sistePos.acc)} m`;
  if(gpsOk && sisteFart!=null) t+=` · ${Math.round(sisteFart*3.6)} km/t`;
  if(tur && gpsOk && tur.meter<10) t+=" — distansen teller når du kjører";
  return t;
}
function haversine(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function startTur(){
  if(!navigator.geolocation){ visToast("Denne enheten gir ikke fra seg posisjon.",null); return; }
  tur={id:nyId(), start:new Date().toISOString(), meter:0, punkter:[], jobbIder:[]};
  gpsOk=false; avvist=new Set(); sistVarsletId=null; sisteAutoPos=null; naerSiden=null; naerId=null;
  watchId=navigator.geolocation.watchPosition(p=>{
    const pos={lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:Date.now()};
    gpsOk=true;
    sisteFart=(p.coords.speed!=null && isFinite(p.coords.speed) && p.coords.speed>=0)?p.coords.speed:null;
    if(pos.acc<=60){
      if(tur){ // guard: en posisjon kan komme inn idet turen avsluttes
        if(sistePos){
          const d=haversine(sistePos,pos);
          if(d>=8 && d<500) tur.meter+=d;
        }
        if(!tur.punkter.length || haversine(tur.punkter[tur.punkter.length-1],pos)>=20)
          tur.punkter.push({lat:pos.lat,lng:pos.lng});
        if(tur.punkter.length>4000) tur.punkter.splice(0,1000);
      }
      sistePos=pos;
      vurderNaerhet();
    }
    if(gjeldendeFane()==="broyt") oppdaterTurpanel();
    if(gjeldendeFane()==="kart") oppdaterKartSpor();
  },err=>{
    gpsOk=false;
    visToast(err.code===1?"Posisjon avslått. Gi stedstilgang i nettleseren for GPS-logg.":"Fikk ikke posisjon ("+err.message+")",null);
    if(gjeldendeFane()==="broyt") oppdaterTurpanel();
  },{enableHighAccuracy:true, maximumAge:3000, timeout:20000});
  // 1 s: nedtellingen til autologg skal telle synlig ned
  tickTimer=setInterval(()=>{ vurderNaerhet(); if(gjeldendeFane()==="broyt") oppdaterTurpanel(); },1000);
  holdSkjermVaaken();
  tegn();
}
let wakeLock=null;
async function holdSkjermVaaken(){
  try{ if(navigator.wakeLock) wakeLock=await navigator.wakeLock.request("screen"); }catch{}
}
// Wake lock slippes av nettleseren når appen går i bakgrunnen — ta den tilbake
document.addEventListener("visibilitychange",()=>{
  if(tur && document.visibilityState==="visible") holdSkjermVaaken();
});
function stoppTur(){
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  clearInterval(tickTimer);
  try{ wakeLock&&wakeLock.release(); }catch{} wakeLock=null;
  if(tur){
    tur.slutt=new Date().toISOString();
    if(tur.meter>30 || tur.jobbIder.length){ state.turer.push(tur); lagre(); visToast("Tur lagret: "+mFmt(tur.meter)+" på "+varighet(new Date(tur.slutt)-new Date(tur.start))+" t",null); }
    tur=null;
  }
  tegn();
}

/* ================= visninger ================= */
const FANER=["broyt","kart","logg","kunder","oversikt"];
let redigerId=null, periodeValg="sesong", sisteJobbId=null, toastTimer=null;
let kartObj=null, sporLinje=null, kundeMarkorer=[];
function gjeldendeFane(){ const h=(location.hash||"").replace("#",""); return FANER.includes(h)?h:"broyt"; }
function tegn(){
  const fane=gjeldendeFane();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("aktiv",a.dataset.fane===fane));
  if(fane!=="kart" && kartObj){ kartObj.remove(); kartObj=null; sporLinje=null; kundeMarkorer=[]; }
  if(fane==="broyt") tegnBroyt();
  else if(fane==="kart") tegnKart();
  else if(fane==="logg") tegnLogg();
  else if(fane==="kunder") tegnKunder();
  else tegnOversikt();
}
function sisteJobbFor(kid){
  let best=null;
  for(const j of state.jobber) if(j.kundeId===kid && (!best||j.ts>best.ts)) best=j;
  return best;
}
/* Nærhetsvarsel: under aktiv tur, finn nærmeste kunde (<100 m) som ikke er
   logget siste 6 t og ikke avvist i denne turen — mLogg/AutoReg-aktig autologging,
   med hindringsvarsel når du nærmer deg (punktvarsel). */
/* Autologging: å kjøre FORBI en kunde skal ikke gi en loggført brøyting — det
   ville gitt feil på fakturaen. Derfor kreves at du blir værende nær kunden en
   stund, slik man gjør når man faktisk måker. Forbikjøring tar sekunder. */
const NAER_RADIUS=100, AUTO_RADIUS=40, FORLAT_RADIUS=70, AUTO_SEK=15;
const KJORE_FART=2.5;      // m/s (9 km/t) — over dette regnes du som kjørende, ikke arbeidende
const FLYTT_ETTER_AUTO=60; // m du må flytte deg før neste autologg kan skje
let naerSiden=null, naerId=null, varselSignatur=null, sisteAutoPos=null;
const autologgPa=()=>state.innstillinger?state.innstillinger.autologg!==false:true;

function naerKunde(){
  if(!tur||!sistePos) return null;
  let best=null;
  for(const k of state.kunder){
    if(k.aktiv===false||k.lat==null||avvist.has(k.id)) continue;
    const s=sisteJobbFor(k.id);
    if(s && (Date.now()-new Date(s.ts))<6*3600e3) continue;
    const d=haversine(sistePos,{lat:k.lat,lng:k.lng});
    if(d<=NAER_RADIUS && (!best||d<best.d)) best={k,d};
  }
  return best;
}
// Sperre rett etter en autologg: står du fortsatt og måker hos Hansen, skal ikke
// naboen Jensen 35 m unna bli logget også. Du må flytte deg først.
function autologgSperret(){
  if(!sisteAutoPos||!sistePos) return false;
  // Har du først kommet deg unna, oppheves sperren for godt — ellers ville en nabo
  // innenfor 60 m aldri kunne autologges, heller ikke når du kommer tilbake senere
  if(haversine(sistePos,sisteAutoPos)>=FLYTT_ETTER_AUTO){ sisteAutoPos=null; return false; }
  return true;
}
// Kalles ved hver GPS-oppdatering: holder styr på hvor lenge du har stått ved kunden
function vurderNaerhet(){
  if(!tur||!sistePos){ naerSiden=null; naerId=null; return; }
  const n=naerKunde();
  if(!n){ naerSiden=null; naerId=null; return; }
  // Holder du fart, kjører du — da teller ikke oppholdet
  const kjorer=sisteFart!=null && sisteFart>KJORE_FART;
  if(n.k.id!==naerId){ naerId=n.k.id; naerSiden=(n.d<=AUTO_RADIUS&&!kjorer)?Date.now():null; }
  else if(kjorer){ naerSiden=null; }
  else if(n.d<=AUTO_RADIUS){ if(naerSiden==null) naerSiden=Date.now(); }
  else if(n.d>FORLAT_RADIUS){ naerSiden=null; }   // kjørte videre — nullstill klokka
  if(autologgPa() && !autologgSperret() && naerSiden!=null && Date.now()-naerSiden>=AUTO_SEK*1000){
    naerSiden=null; naerId=null;
    sisteAutoPos={lat:sistePos.lat,lng:sistePos.lng};
    loggJobb(n.k,"broyting",true);
  }
}
function sekunderIgjen(){
  if(naerSiden==null) return null;
  return Math.max(0, AUTO_SEK-Math.round((Date.now()-naerSiden)/1000));
}
function naervarselHtml(){
  const n=naerKunde();
  if(!n){ sistVarsletId=null; return ""; }

    try{ navigator.vibrate&&navigator.vibrate(200); }catch{}
  }
  const igjen=sekunderIgjen();
  const nedtelling=!autologgPa() ? ""
    : autologgSperret() ? '<div class="under">Flytt deg litt unna forrige kunde før neste autologg</div>'
    : igjen!=null ? `<div class="under">Logges automatisk om <span id="auto-ned">${igjen}</span> s — kjør videre for å avbryte</div>`
    : '<div class="under">Stopp ved kunden, så logges brøytingen av seg selv</div>';
  return `<div class="naervarsel"><div class="tittel">Du er ved ${esc(n.k.navn)}</div>
    <div class="under">${mFmt(n.d)} unna</div>

}

function kundekort({k,sist,avstand}){

function tegnBroyt(){
  if(state.kunder.length===0){
    innhold.innerHTML=turpanelHtml()+'<div class="tom"><b>Ingen kunder ennå.</b><br>Legg inn innkjørslene du brøyter, så logger du hver tur med ett trykk.<div class="btnrow" style="justify-content:center"><button class="btn-sek" style="flex:0 1 auto" onclick="location.hash=\'kunder\'">Legg til kunde</button><button class="btn-ghost" id="demo-knapp" style="flex:0 1 auto">Prøv med eksempeldata</button></div></div>';
    kobleTurknapper(); return;
  }
  const aktive=state.kunder.filter(k=>k.aktiv!==false).map(k=>({
    k, sist:sisteJobbFor(k.id),
    avstand:(sistePos&&k.lat!=null)?haversine(sistePos,{lat:k.lat,lng:k.lng}):null
  }));
  let html=turpanelHtml();
  if(sistePos){
    // GPS aktiv: flat liste sortert etter avstand — nærmeste øverst
    const liste=[...aktive].sort((a,b)=>(a.avstand??1e12)-(b.avstand??1e12));
    html+='<h2>Nærmest deg</h2><div class="cardlist">'+liste.map(kundekort).join("")+"</div>";
  }else{
    // Uten GPS: grupper per rode, lengst ventetid først
    const grupper=new Map();
    for(const el of aktive){
      const nøkkel=(el.k.rode||"").trim()||"Uten rode";
      if(!grupper.has(nøkkel)) grupper.set(nøkkel,[]);
      grupper.get(nøkkel).push(el);
    }
    const navn=[...grupper.keys()].sort((a,b)=>a==="Uten rode"?1:b==="Uten rode"?-1:a.localeCompare(b,"nb"));
    html+='<h2>Logg en tur</h2>';
    for(const n of navn){
      const liste=grupper.get(n).sort((a,b)=>(a.sist?a.sist.ts:"")<(b.sist?b.sist.ts:"")?-1:1);
      const ferdige=liste.filter(x=>x.sist && (Date.now()-new Date(x.sist.ts))<12*3600e3).length;
      const pct=Math.round(100*ferdige/liste.length);
      html+=`<div class="rode-head"><div class="rode-navn">${esc(n)}</div><div class="rode-telling">${ferdige} av ${liste.length} siste 12 t</div></div>
        <div class="fremdrift" role="img" aria-label="${pct} % ferdig"><div style="width:${pct}%"></div></div>
        <div class="cardlist">${liste.map(kundekort).join("")}</div>`;
    }
  }
  innhold.innerHTML=html;
  kobleTurknapper();
}
function kobleTurknapper(){
  const s=$("#start-tur"); if(s) s.addEventListener("click",startTur);
  const p=$("#stopp-tur"); if(p) p.addEventListener("click",stoppTur);
  const a=$("#autologg");
  if(a) a.addEventListener("change",()=>{
    state.innstillinger={...(state.innstillinger||{}), autologg:a.checked};
    if(!a.checked) naerSiden=null;
    lagre();
    varselSignatur=null; oppdaterTurpanel();
    visToast(a.checked?("Autologg på — stopp ved kunden i "+AUTO_SEK+" sekunder"):"Autologg av — du logger selv",null);
  });
}
function tegnKart(){
  innhold.innerHTML='<h2>Kart</h2><div id="kart"></div><div class="notis">Gult spor: pågående eller siste tur. Markører: kunder med lagret posisjon.</div>';
  if(typeof L==="undefined"){ $("#kart").outerHTML='<div class="tom">Kartet trenger nett for å laste første gang.</div>'; return; }
  const medPos=state.kunder.filter(k=>k.lat!=null);
  let senter=[65.0,13.0], zoom=4;
  if(sistePos){ senter=[sistePos.lat,sistePos.lng]; zoom=13; }
  else if(medPos.length){ senter=[medPos[0].lat,medPos[0].lng]; zoom=12; }
  kartObj=L.map("kart").setView(senter,zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(kartObj);
  for(const k of medPos){
    const m=L.marker([k.lat,k.lng]).addTo(kartObj).bindPopup("<b>"+esc(k.navn)+"</b><br>"+esc(k.adresse||"")+(k.hindring?"<br>⚠ "+esc(k.hindring):""));
    kundeMarkorer.push(m);
  }
  oppdaterKartSpor();
  if(sistePos) L.circleMarker([sistePos.lat,sistePos.lng],{radius:7,color:"#f6a41d",fillOpacity:.9}).addTo(kartObj);
}
function oppdaterKartSpor(){
  if(!kartObj) return;
  const kilde=tur&&tur.punkter.length?tur.punkter:(state.turer.length?state.turer[state.turer.length-1].punkter:[]);
  if(!kilde||kilde.length<2) return;
  const pts=kilde.map(p=>[p.lat,p.lng]);
  if(sporLinje) sporLinje.setLatLngs(pts);
  else sporLinje=L.polyline(pts,{color:"#f6a41d",weight:4}).addTo(kartObj);
}
function tegnLogg(){
  const rader=[
    ...state.jobber.map(j=>({slag:"jobb",ts:j.ts,j})),
    ...state.turer.map(t=>({slag:"tur",ts:t.slutt||t.start,t}))
  ].sort((a,b)=>a.ts<b.ts?1:-1).slice(0,200);
  if(!rader.length){ innhold.innerHTML='<h2>Historikk</h2><div class="tom">Ingen turer logget ennå.</div>'; return; }
  let html='<h2>Historikk</h2>', dag="";
  for(const r of rader){
    const dt=dagTittel(r.ts);
    if(dt!==dag){ html+=`<div class="loggdag">${esc(dt)}</div>`; dag=dt; }
    if(r.slag==="jobb"){
      const j=r.j;
      const pill=j.type==="stroing"?'<span class="type-pill type-stroing">strøing</span>':'<span class="type-pill type-broyting">brøyting</span>';
      const pos=j.auto?' <span class="under">· autologget</span>':(j.lat!=null?' <span class="under">· posisjon lagret</span>':"");
      html+=`<div class="loggrad"><div class="hva">${esc(j.kundeNavn||"Ukjent")}${pill}${pos}</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="tid">${klokke(j.ts)}</span>
        <button class="btn-ghost" data-slettjobb="${j.id}" aria-label="Slett">✕</button></div></div>`;
    }else{
      const t=r.t, ms=new Date(t.slutt)-new Date(t.start);
      const kundenavn=t.jobbIder.map(id=>{const j=state.jobber.find(x=>x.id===id);return j?j.kundeNavn:null;}).filter(Boolean).join(", ");
      html+=`<div class="loggrad"><div class="hva">Tur <span class="type-pill type-tur">GPS</span><div class="under">${mFmt(t.meter)} · ${varighet(ms)} t · ${t.jobbIder.length} logget${kundenavn?": "+esc(kundenavn):""}</div></div>
        <div style="display:flex;gap:8px;align-items:center"><span class="tid">${klokke(t.start)}–${klokke(t.slutt)}</span>
        <button class="btn-ghost" data-sletttur="${t.id}" aria-label="Slett">✕</button></div></div>`;
    }
  }
  html+='<div class="notis">Viser de siste 200 radene.</div>';
  innhold.innerHTML=html;
}
/* ===== Adressesøk mot Kartverket (ws.geonorge.no) =====
   Gir koordinater rett fra adressen, så man slipper å kjøre dit for å pinne GPS. */
let adrPos=null, adrTimer=null;
function kobleAdressesok(){
  const inp=$("#f-adresse"); if(!inp) return;
  inp.addEventListener("input",()=>{
    adrPos=null;
    const st=$("#adr-status"); if(st){ st.textContent=""; st.className="adrstatus"; }
    clearTimeout(adrTimer);
    const q=inp.value.trim();
    const boks=$("#adr-treff");
    if(q.length<3){ if(boks){ boks.hidden=true; boks.innerHTML=""; } return; }
    adrTimer=setTimeout(()=>sokAdresse(q),400);
  });
}
async function sokAdresse(q){
  const boks=$("#adr-treff"), st=$("#adr-status");
  if(!boks||!st) return;
  st.textContent="Søker …"; st.className="adrstatus";
  let treff=[];
  try{
    const r=await fetch("https://ws.geonorge.no/adresser/v1/sok?fuzzy=true&treffPerSide=6&sok="+encodeURIComponent(q));
    if(!r.ok) throw new Error("status "+r.status);
    const j=await r.json();
    treff=(j.adresser||[]).filter(a=>a.representasjonspunkt);
  }catch{
    boks.hidden=true; boks.innerHTML="";
    st.textContent="Fikk ikke kontakt med adressesøket. Skriv adressen fritt — du kan sette posisjonen med GPS senere.";
    return;
  }
  if($("#f-adresse").value.trim()!==q) return;   // brukeren har skrevet videre
  if(!treff.length){
    boks.hidden=true; boks.innerHTML="";
    st.textContent="Fant ingen adresse. Skriv den fritt — du kan sette posisjonen med GPS når du står der.";
    return;
  }
  st.textContent="";
  boks.hidden=false;
  boks.innerHTML=treff.map((a,i)=>`<button type="button" data-adr="${i}">${esc(a.adressetekst)} — ${esc(a.postnummer+" "+a.poststed)}</button>`).join("");
  boks.querySelectorAll("[data-adr]").forEach(b=>b.addEventListener("click",()=>{
    const a=treff[+b.dataset.adr];
    $("#f-adresse").value=a.adressetekst+", "+a.postnummer+" "+a.poststed;
    adrPos={lat:a.representasjonspunkt.lat, lng:a.representasjonspunkt.lon};
    boks.hidden=true; boks.innerHTML="";
    st.textContent="Posisjon hentet fra adressen ✓"; st.className="adrstatus ok";
  }));
}

            <button class="btn-ghost" data-rediger="${k.id}">Endre</button>
            <button class="btn-ghost" data-posisjon="${k.id}">Sett GPS her</button>
            <button class="btn-danger" data-slettkunde="${k.id}">Slett</button>
          </div>
        </div>
      </div>`).join("")+"</div>";
  }
  html+='<h2 class="skjult-bak">Sikkerhetskopi</h2><div class="card"><div class="btnrow" style="margin-top:0">'+
    '<button class="btn-sek" id="eksporter">Last ned backup (JSON)</button>'+

    '<div class="notis">Posisjon kan settes på to måter: velg adressen i søkelista når du oppretter kunden, eller trykk «Sett GPS her» på kundekortet mens du står på stedet — det siste er mest presist når innkjørselen ligger et stykke fra postadressen. Adressesøk: Kartverket.</div>';
  innhold.innerHTML=html;

  $("#kundeskjema").addEventListener("submit",e=>{
    e.preventDefault();
    const navn=$("#f-navn").value.trim(); if(!navn) return;
    const felt={navn, adresse:$("#f-adresse").value.trim(), rode:$("#f-rode").value.trim(),
      hindring:$("#f-hindring").value.trim(), prismodell:$("#f-modell").value, pris:Number($("#f-pris").value)||0};
    // Posisjon fra adressesøket. Uten valgt treff beholdes kundens eksisterende posisjon.
    if(adrPos){ felt.lat=adrPos.lat; felt.lng=adrPos.lng; }
    if(redigerId){
      const k=state.kunder.find(x=>x.id===redigerId);
      if(k) Object.assign(k,felt);
      redigerId=null; visToast("Kunde oppdatert",null);
    }else{
      state.kunder.push({id:nyId(), ...felt, aktiv:true, opprettet:new Date().toISOString()});

    };
    r.readAsText(fil);
  });
}
function tegnOversikt(){
  if(!state.kunder.length){
    innhold.innerHTML='<h2>Fakturagrunnlag</h2><div class="tom"><b>Ingen kunder ennå.</b><br>Når du har lagt inn kunder og logget turer, får du antall brøytinger og estimert beløp per kunde her.<div class="btnrow" style="justify-content:center"><button class="btn-sek" style="flex:0 1 auto" onclick="location.hash=\'kunder\'">Legg til kunde</button></div></div>';
    return;
  }
  const fra=periodeValg==="30d"?new Date(Date.now()-30*864e5).toISOString():sesongStart();
  const rader=state.kunder.map(k=>{
    const mine=state.jobber.filter(j=>j.kundeId===k.id && j.ts>=fra);
    const br=mine.filter(j=>j.type!=="stroing").length;
    const st=mine.filter(j=>j.type==="stroing").length;
    const inntekt=k.prismodell==="sesong"?(periodeValg==="30d"?0:(k.pris||0)):(br+st)*(k.pris||0);
    return {navn:k.navn, rode:k.rode||"", br, st, inntekt};
  }).sort((a,b)=>b.inntekt-a.inntekt);
  const sum=rader.reduce((s,r)=>({br:s.br+r.br,st:s.st+r.st,inntekt:s.inntekt+r.inntekt}),{br:0,st:0,inntekt:0});
  const turer=state.turer.filter(t=>t.start>=fra);
  const turMeter=turer.reduce((s,t)=>s+t.meter,0);
  const turMs=turer.reduce((s,t)=>s+(new Date(t.slutt)-new Date(t.start)),0);
  innhold.innerHTML='<h2>Fakturagrunnlag</h2>'+
    '<div class="periodevalg"><label style="flex-direction:row;align-items:center;gap:8px">Periode '+
    `<select id="periode"><option value="sesong"${periodeValg==="sesong"?" selected":""}>Sesongen (fra 1. okt)</option><option value="30d"${periodeValg==="30d"?" selected":""}>Siste 30 dager</option></select></label></div>`+
    `<div class="notis">GPS-dokumentasjon i perioden: ${turer.length} turer, ${mFmt(turMeter)} kjørt, ${varighet(turMs)} t bak rattet.</div>`+
    '<div class="card tabellboks"><table class="stat">'+
    '<thead><tr><th>Kunde</th><th class="num">Brøyt</th><th class="num">Strø</th><th class="num">Estimat</th></tr></thead><tbody>'+
    rader.map(r=>`<tr><td>${esc(r.navn)}${r.rode?'<div class="under">'+esc(r.rode)+"</div>":""}</td><td class="num">${r.br}</td><td class="num">${r.st}</td><td class="num">${nok(r.inntekt)}</td></tr>`).join("")+
    `<tr class="sumlinje"><td>Sum</td><td class="num">${sum.br}</td><td class="num">${sum.st}</td><td class="num">${nok(sum.inntekt)}</td></tr>`+
    '</tbody></table></div>'+
    '<div class="btnrow"><button class="btn-sek" id="last-csv" style="flex:0 1 auto">Last ned CSV</button>'+
    '<button class="btn-sek" id="del-sammendrag" style="flex:0 1 auto">Del sammendrag</button></div>'+
    '<div class="notis">Estimatet bruker kundens prismodell: fastpris telles én gang per sesong (ikke i 30-dagersvisningen), per-gang ganges med antall turer. Grunnlag for fakturering, ikke regnskap.</div>';
  $("#periode").addEventListener("change",e=>{ periodeValg=e.target.value; tegn(); });
  const periodenavn=periodeValg==="30d"?"siste 30 dager":"sesongen";
  $("#del-sammendrag").addEventListener("click",async ()=>{
    const linjer=rader.filter(r=>r.br+r.st>0 || r.inntekt>0).map(r=>`${r.navn}: ${r.br} brøyt, ${r.st} strø — ${nok(r.inntekt)}`);
    const tekst=`Brøytelogg, ${periodenavn}:\n`+(linjer.length?linjer.join("\n"):"Ingen turer logget.")+`\nSum: ${sum.br} brøyt, ${sum.st} strø — ${nok(sum.inntekt)}`;
    if(navigator.share){ try{ await navigator.share({text:tekst}); return; }catch{} }
    try{ await navigator.clipboard.writeText(tekst); visToast("Sammendrag kopiert — lim inn i melding eller e-post",null); }
    catch{ visToast("Kunne ikke dele på denne enheten.",null); }
  });
  const csvFelt=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  $("#last-csv").addEventListener("click",()=>{
    const csv=["Kunde;Rode;Brøytinger;Strøinger;Estimat kr"].concat(rader.map(r=>[csvFelt(r.navn),csvFelt(r.rode),r.br,r.st,r.inntekt].join(";"))).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="fakturagrunnlag-"+new Date().toISOString().slice(0,10)+".csv";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  });
}

/* ================= handlinger ================= */
function loggJobb(k,type,auto){
  const j={id:nyId(), kundeId:k.id, kundeNavn:k.navn, type, ts:new Date().toISOString()};
  if(sistePos){ j.lat=sistePos.lat; j.lng=sistePos.lng; }
  if(auto) j.auto=true;
  state.jobber.push(j);
  if(tur) tur.jobbIder.push(j.id);
  sisteJobbId=j.id;
  lagre();
  const navn=type==="stroing"?"Strøing":"Brøyting";
  visToast(auto?("Autologget "+navn.toLowerCase()+": "+k.navn):(navn+" logget: "+k.navn), true);
  if(auto){ try{ navigator.vibrate&&navigator.vibrate([120,70,120]); }catch{} }
  tegn();
}
function visToast(tekst, medAngre){
  $("#toasttekst").textContent=tekst;
  $("#angre").hidden=!medAngre;
  $("#toast").hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ $("#toast").hidden=true; },5000);
}
document.addEventListener("click",e=>{
  const logg=e.target.closest("[data-logg]");
  if(logg){
    const k=state.kunder.find(x=>x.id===logg.dataset.logg); if(!k) return;
    if(k.id===naerId){ naerSiden=null; naerId=null; }   // manuell logging stopper nedtellingen
    loggJobb(k,logg.dataset.type,false);
    return;
  }
  const av=e.target.closest("[data-avvis]");
  if(av){ avvist.add(av.dataset.avvis); const nv=$("#naervarsel"); if(nv) nv.innerHTML=naervarselHtml(); return; }
  const rd=e.target.closest("[data-rediger]");
  if(rd){ redigerId=rd.dataset.rediger; tegn(); window.scrollTo({top:0}); return; }
  const posKnapp=e.target.closest("[data-posisjon]");
  if(posKnapp){
    const k=state.kunder.find(x=>x.id===posKnapp.dataset.posisjon); if(!k) return;
    if(!navigator.geolocation){ visToast("Denne enheten gir ikke fra seg posisjon.",null); return; }
    posKnapp.textContent="Henter …";
    navigator.geolocation.getCurrentPosition(p=>{
      k.lat=p.coords.latitude; k.lng=p.coords.longitude; lagre(); tegn();
      visToast("Posisjon lagret for "+k.navn,null);
    },err=>{ posKnapp.textContent="Sett GPS her"; visToast(err.code===1?"Posisjon avslått i nettleseren.":"Fikk ikke posisjon.",null); },
    {enableHighAccuracy:true, timeout:15000});
    return;
  }
  const sj=e.target.closest("[data-slettjobb]");
  if(sj){ state.jobber=state.jobber.filter(j=>j.id!==sj.dataset.slettjobb); lagre(); tegn(); return; }
  const st=e.target.closest("[data-sletttur]");
  if(st){ state.turer=state.turer.filter(t=>t.id!==st.dataset.sletttur); lagre(); tegn(); return; }
  const sk=e.target.closest("[data-slettkunde]");
  if(sk){
    const k=state.kunder.find(x=>x.id===sk.dataset.slettkunde);
    if(sk.dataset.bekreft!=="1"){ sk.dataset.bekreft="1"; sk.textContent="Sikker? Trykk igjen"; setTimeout(()=>{sk.dataset.bekreft="";sk.textContent="Slett";},4000); return; }
    if(redigerId===sk.dataset.slettkunde) redigerId=null;
    state.kunder=state.kunder.filter(x=>x.id!==sk.dataset.slettkunde);
    lagre(); tegn();
    visToast("Slettet "+(k?k.navn:"kunden")+". Loggede turer beholdes.",null);
    return;
  }
});
$("#angre").addEventListener("click",()=>{
  if(sisteJobbId){
    state.jobber=state.jobber.filter(j=>j.id!==sisteJobbId);
    if(tur) tur.jobbIder=tur.jobbIder.filter(id=>id!==sisteJobbId);
    sisteJobbId=null; lagre(); tegn();
  }
  $("#toast").hidden=true;
});

/* ================= oppstart ================= */
window.addEventListener("hashchange",tegn);
lesLager(); lagre(); tegn();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
